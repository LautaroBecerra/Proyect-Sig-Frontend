<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-label>Alertas de inundaciones</ion-label>
      <ion-toggle
        slot="end"
        [checked]="settingsState.notifications.floodAlerts"
        (ionChange)="toggle('floodAlerts')"
      ></ion-toggle>
    </ion-item>
    <ion-item>
      <ion-label>Alertas de lluvias</ion-label>
      <ion-toggle
        slot="end"
        [checked]="settingsState.notifications.rainAlerts"
        (ionChange)="toggle('rainAlerts')"
      ></ion-toggle>
    </ion-item>
    <ion-item lines="none">
      <ion-label>Alertas de reportes cercanos</ion-label>
      <ion-toggle
        slot="end"
        [checked]="settingsState.notifications.nearbyReportAlerts"
        (ionChange)="toggle('nearbyReportAlerts')"
      ></ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
